# Rules that keep wallet key material out of the logs.

# Rule: Descriptor text or other key material passed to a logger.
# Descriptors, bundles and auth key files can hold private keys. The values
# walletdesc returns redact themselves through String and LogValue, but the
# text form (a request field, a parsed line, the output of Render) is a plain
# string and logs in full.
#
# ast-grep has no type information, so this matches on names. A singular
# `descriptor` is left alone: it is also the VTXO descriptor, which holds no
# secret. `len(...)` is allowed, since a count reveals nothing.
id: no-logged-key-material
language: go
severity: error
message: "Do not pass descriptor text or key material to a logger"
# Tests hold throwaway keys, and walletdesc's prove redaction by logging values.
ignores:
  - "**/*_test.go"
note: |
  Descriptors, watch-only bundles, auth key files and mnemonics can hold
  private keys. Log a count, a fingerprint or the manifest hash instead.

  WRONG:
    log.InfoS(ctx, "Creating wallet", "descriptors", req.Descriptors)
    log.Debugf("key: %s", desc.Render(true))

  RIGHT:
    log.InfoS(ctx, "Creating wallet",
      slog.Int("descriptors", len(req.Descriptors)))
rule:
  kind: call_expression
  all:
    # The callee is a logging method on a logger, a log/slog call or
    # attribute constructor, or btclog's lazy formatter. A logger is a name
    # ending in log or logger as a whole word or camelCase suffix (so not
    # dialog or backlog), or a call to one: a.logger(ctx), r.deps.resolveLog()
    # and build.LoggerFromContext(ctx).WithPrefix(Subsystem) are all common.
    - has:
        field: function
        regex: "(?s)((^|\\.)(log|logger|Log|Logger|LoggerFromContext|[a-z][A-Za-z0-9]*(Log|Logger))(\\(.*\\))?(\\.WithPrefix\\(.*\\))?\\.(Trace|Debug|Info|Warn|Error|Critical|Print|Println|Fatal)[fS]?|^slog\\.[A-Z][A-Za-z0-9]*|^btclog\\.Fmt)$"
    - has:
        field: arguments
        has:
          stopBy: end
          any:
            # A secret-bearing value, by variable, field or getter name.
            - kind: identifier
              regex: &secret "^((?i:(Get)?(wallet)?descriptors|descriptorTexts?|descriptorFile|mnemonic|seedPassphrase|authKeys|watchOnlyBundle|bundleText|xprvs?))$"
              not: &counted
                inside:
                  stopBy: end
                  kind: call_expression
                  has:
                    field: function
                    regex: "^len$"
            - kind: field_identifier
              regex: *secret
              not: *counted
            # Text renderers, whatever the receiver is called.
            - kind: call_expression
              has:
                field: function
                regex: "(^|\\.)(Render|FormatBundle|FormatAuthKeys|FormatManifest)$"
